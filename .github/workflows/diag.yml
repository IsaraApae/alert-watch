# Temporary: checks the LINE webhook switch and where the script redirects to. Safe to delete.
name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: |
          info=$(curl -s -H "Authorization: Bearer $LINE_TOKEN" https://api.line.me/v2/bot/channel/webhook/endpoint)
          echo "== webhook switch on: $(echo "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("active"))')"
          url=$(echo "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("endpoint",""))')
          # an empty LINE delivery: the script runs but does nothing
          curl -s -o /dev/null -D /tmp/h -X POST -H "Content-Type: application/json" -d '{"destination":"x","events":[]}' "$url"
          echo "== script answered: $(head -1 /tmp/h | tr -d '\r')"
          echo "== redirect goes to host: $(grep -i '^location:' /tmp/h | sed -E 's#^[Ll]ocation: *https?://([^/]+).*#\1#' | tr -d '\r')"
