# Temporary: checks the watcher reads the channels through the YouTube key. Safe to delete.
name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: |
          python3 - <<'PY'
          import os, time, watch
          from datetime import datetime
          print("== key present:", bool(os.environ.get("YOUTUBE_KEY")))
          v = watch.youtube_videos()
          print("== uploads read:", len(v))
          for ch in watch.YT_CHANNELS.values():
              mine = sorted((p for t, l, p, c in v if c == ch), reverse=True)
              if mine:
                  print(f"== {ch}: {len(mine)} uploads, newest {datetime.fromtimestamp(mine[0], watch.THAI):%a %d %b %H:%M} ({(time.time() - mine[0]) / 3600:.1f} h ago)")
          rel = datetime(2026, 10, 4, 1, 0, tzinfo=watch.THAI).timestamp()
          print("== finds Magic Repo Man episode 1:", bool(watch.youtube_episode(v, watch.anime_list()[202250]["yt"], {1}, rel)))
          PY
