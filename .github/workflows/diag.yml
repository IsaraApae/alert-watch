# Temporary: asks LINE whether the reply cards are valid, without sending them. Safe to delete.
name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          for name, msgs in json.load(open("diag-messages.json")).items():
              req = urllib.request.Request("https://api.line.me/v2/bot/message/validate/reply", data=json.dumps({"messages": msgs}).encode(),
                                           headers={"Authorization": "Bearer " + os.environ["LINE_TOKEN"], "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=30); print(f"== {name}: valid ({len(msgs)} messages)")
              except urllib.error.HTTPError as e:
                  print(f"== {name}: INVALID {e.code} {e.read()[:400]}")
          PY
