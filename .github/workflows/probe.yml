name: probe
# One normal request to each site from GitHub's servers, to see whether they answer; sends no alerts.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://animeruka.com/anime/ https://animegojos.com/ https://anime-waku.com/anime/; do
            curl -sL -A "Mozilla/5.0" --max-time 20 -o page.html -w "$u -> %{http_code} %{url_effective} %{size_download}B " "$u" || true
            grep -oiE "just a moment|cf-chl|cf-turnstile|attention required|access denied" page.html | sort -u | tr '\n' ' '
            echo; grep -oE '<title>[^<]{0,80}' page.html | head -1
          done
