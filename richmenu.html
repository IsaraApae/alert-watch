<!doctype html>
<!-- The LINE chat menu, drawn in the anime website's style (site/anime/index.html): one white rounded panel like its cards and floating menu, on
     the site's light grey, split into four buttons by its hairlines, each its outline icon over its label. To change it: edit this, screenshot it at
     1250 x 422 with a device scale of 2 (headless Chrome), crop to 2500 x 843, save as richmenu.png, and run the watch
     workflow with "richmenu". The four columns match the four tap areas in setup_richmenu in watch.py (625 px each). -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 1250px; height: 422px; overflow: hidden; background: #F5F5F7; }
body { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; color: #17171A;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Sukhumvit Set", "Thonburi", "Noto Sans Thai", system-ui, sans-serif; }
/* one white panel like the site's cards and menu: rounded corners, a hairline edge and the menu's soft shadow */
.menu { position: absolute; inset: 22px 22px 28px; border-radius: 64px; background: #FFFFFF; border: 1.5px solid #0000000A;
  box-shadow: 0 2px 4px #0000000F, 0 22px 48px -18px #00000040; }
/* four buttons, split by the site's hairlines (as between its list rows), on the tap areas' edges */
.tab { position: relative; display: grid; justify-items: center; align-content: center; gap: 16px; height: 100%; padding-bottom: 6px; }
.tab + .tab::before { content: ""; position: absolute; left: -1px; top: 30%; bottom: 30%; border-left: 2px solid #3C3C4326; }
.tab svg { width: 96px; height: 96px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab img { width: 140px; height: 96px; object-fit: contain; }
.tab b { font-size: 42px; font-weight: 600; letter-spacing: -.01em; line-height: 1; }
</style></head><body>
<div class="menu"></div>
<div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b>Next</b></div>
<div class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><b>Timetable</b></div>
<div class="tab"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><b>Aired</b></div>
<div class="tab"><img src="https://isaraapae.github.io/alert-watch/f1-logo.png" alt=""><b>F1 Live</b></div>
</body></html>
